<section class="container">
  <div class="my-auto">
    <div class="col col-lg-6">
      <h2>Welcome</h2>
      <p class="mt-3 fw-medium">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Incidunt qui, quos accusamus
        veritatis velit laudantium quae alias iure quidem. Perferendis quo provident laborum dolor,
        fugiat laudantium ab ratione vitae voluptatibus?
      </p>
      <ul class="w-100 d-flex gap-2  m-0 p-0 aling-items-center">
        @for (item of Itens; track $index) {
          <span
            class="border border-info rounded text-info p-2 text-center d-flex align-items-center justify-content-center"
            href
            ><i class="text-info {{ item.simbol }}"></i>{{ item.titulo }}</span
          >
        }
      </ul>
    </div>
    <div class="col">
      <img class="img-fluid" src="/." alt="certificade image" />
    </div>
  </div>
</section>
