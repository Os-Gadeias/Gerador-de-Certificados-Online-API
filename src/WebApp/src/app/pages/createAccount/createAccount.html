<section class="authSection">
  <div class="container d-flex align-items-center justify-content-center">
    <form
      class="container formularioInput certificado border border-info p-4 rounded d-flex flex-column gap-4"
      action=""
      method="post"
    >
      <div class="d-flex flex-column align-items-center">
        <h3 class="text-center display-6 m-0">Create Your Account!</h3>
        <hr class="m-0 p-0 text-info w-50" />
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input
          type="email"
          class="form-control"
          id="email"
          aria-describedby="emailHelp"
          placeholder="Enter email"
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Password" />
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
      <span>Already have a Account? <a href="" routerLink="/login">Login Here!</a></span>
    </form>
  </div>
</section>
<app-footer></app-footer>
