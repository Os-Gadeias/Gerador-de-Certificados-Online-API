<section>
  <div class="container d-flex align-items-center justify-content-center">
    <form
      class="container formularioInput certificado border border-info p-4 rounded d-flex flex-column gap-4"
      action=""
      method="post"
    >
      <div class="d-flex flex-column align-items-center">
        <h3 class="text-center display-6 m-0">Welcome Back!</h3>
        <hr class="m-0 p-0 text-info w-50" />
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input
          type="email"
          class="form-control"
          id="email"
          aria-describedby="emailHelp"
          placeholder="Enter email"
        />
        <small id="emailHelp" class="form-text text-light"
          >We'll never share your email with anyone else.</small
        >
      </div>
      <div class="form-group">
        <label for="exampleInputPassword1">Password</label>
        <input
          type="password"
          class="form-control"
          id="exampleInputPassword1"
          placeholder="Password"
        />
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
      <span>Don't have a account? <a href="">Create Here!</a></span>
    </form>
  </div>
</section>
