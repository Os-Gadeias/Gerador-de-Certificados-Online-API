<section id="home" class="container min-vh-100 d-flex align-items-center mt-5 pt-5 pt-lg-0 mt-lg-0">
  <div class="row align-items-center w-100 mx-auto g-5">
    <!-- Coluna Esquerda: Textos e Itens/Badges -->
    <div
      class="col-12 col-lg-6 d-flex flex-column justify-content-center order-1 order-lg-0 text-start"
    >
      <h1 class="display-5 fw-bold text-light mb-2">
        Welcome to <br />
        <span class="text-primary">Online Certificate Generator</span>
      </h1>

      <hr class="w-25 text-primary opacity-75 my-3 border-2" />

      <p class="text-secondary fs-5 mb-4 lh-base">
        Register students and courses quickly to generate certificates! Download your certificates
        in PDF format quickly and easily!
      </p>

      <!-- Lista Dinâmica de Badges/Botões -->
      <div class="d-flex flex-wrap gap-2 m-0 p-0 align-items-center">
        @for (item of Itens; track $index) {
          <div
            class="border border-primary border-opacity-50 bg-dark bg-opacity-50 rounded-3 text-secondary px-3 py-2 d-flex align-items-center gap-2 shadow-sm"
          >
            <i class="text-primary fs-5 {{ item.simbol }}"></i>
            <span class="fw-medium text-light small">{{ item.titulo }}</span>
          </div>
        }
      </div>
    </div>

    <!-- Coluna Direita: Imagem com o Efeito Certificado -->
    <div class="col-12 col-lg-6 text-center order-0 order-lg-1">
      <div
        class="certificado p-2 bg-dark rounded-4 border border-secondary border-opacity-10 overflow-hidden"
      >
        <img
          class="img-fluid rounded-3 w-100"
          src="/images/certificade.png"
          alt="Certificate image preview"
        />
      </div>
    </div>
  </div>
</section>
