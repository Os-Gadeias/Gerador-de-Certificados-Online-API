<section
  id="certificade"
  class="smallerSection bg-lighterDark align-items-center justify-content-center p-4 p-md-5"
>
  <div class="container py-4">
    <div class="row g-4 align-items-center justify-content-between">
      <!-- Coluna Esquerda: Título, Descrição e Botão -->
      <div class="col-12 col-lg-5 text-start">
        <span
          class="badge bg-danger bg-opacity-20 text-primary px-3 py-2 rounded-pill fw-semibold mb-3 fs-6 text-light"
        >
          <i class="bi bi-person me-1"></i> Students
        </span>
        <h2 class="fw-bold text-light display-5 mb-3">
          Select your <span class="text-danger">Courses</span>
        </h2>
        <p class="text-secondary lead mb-4">
          And link your students to the courses to generete their certificades and download them
          quickly!
        </p>
        <form action="" class="form-group d-flex flex-column gap-1">
          <label for="course" class="form-label text-light fw-medium mb-1"
            >Select your Course</label
          >
          <div class="input-group">
            <select
              type="text"
              class="form-control rounded-3 border border-primary border-opacity-50 ps-2 text-secondary"
              style="background-color: #2a1941"
              id="course"
            >
              <option
                class="form-select rounded-3 border border-primary border-opacity-50 ps-2"
                value=""
              >
                Select a Course
              </option>
              @for (item of courses(); track item.id) {
                <option
                  name="course"
                  [id]="item.id"
                  class="form-select rounded-3 border border-primary border-opacity-50 ps-2"
                >
                  {{ item.name }}
                </option>
              }
            </select>
          </div>
          <label for="student" class="form-label text-light fw-medium mb-1"
            >Enter the Student Name</label
          >
          <div class="input-group">
            <input
              type="text"
              class="form-control rounded-3 border border-primary border-opacity-50 ps-2"
              id="student"
            />
          </div>
          <a
            routerLink=""
            class="btn btn-danger btn-lg rounded-3 px-4 py-2 mt-2 fw-bold text-white shadow d-inline-flex align-items-center gap-2"
          >
            <i class="bi bi-plus-circle fs-5"></i> Enroll Student
          </a>
        </form>
      </div>
      <div class="col-12 col-lg-6">
        <!-- Coluna Direita: Listagem de Cursos (Estado Vazio) -->
        <div
          class="p-4 p-md-5 bg-dark rounded-4 shadow-lg border border-secondary border-opacity-10 min-vh-50 d-flex flex-column justify-content-center"
        >
          <!-- Lista / Contêiner de Cursos -->
          <div id="courseListContainer" class="d-flex flex-column gap-3">
            <!-- Estado Vazio (Mensagem Padrão) -->
            <div class="text-center py-5">
              <div class="mb-3">
                <i class="bi bi-person text-secondary display-1 opacity-50"></i>
              </div>
              <h4 class="text-light fw-semibold mb-2">No Students Enrolled</h4>
              <p class="text-secondary small mb-0 mx-auto" style="max-width: 320px">
                You haven't added any Students yet. Click the button on the right to enroll.
              </p>
            </div>

            <!-- Exemplo de como ficará o item na lista quando retornado pela API (Comentado) -->

              </div>

        </div>
      </div>
    </div>
  </div>
</section>
